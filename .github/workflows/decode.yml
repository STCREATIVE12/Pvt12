name: Decode Cache and Export Streams

on:
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante baad auto-run
  workflow_dispatch:        # GitHub se manual 'Run workflow' button

jobs:
  run-decoder:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Decode Cache Script
        run: |
          python decode_cache.py

      - name: Commit and Push Decoded Streams
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "actions-user"
          git add decoded_streams.json
          git diff --staged --quiet || (git commit -m "Auto-update decoded streams [skip ci]" && git push)
