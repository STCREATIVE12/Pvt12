name: Generate Live Events JSON

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '0 */3 * * *'  # Har 3 hours mein automatic run hoga
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pycryptodome

    - name: Extract Protected ZIP
      env:
        ZIP_PASS: ${{ secrets.ZIP_PASSWORD }}
      run: |
        # ZipCrypto wali file ko secret password ke sath extract karega
        unzip -P "$ZIP_PASS" playz_extractor.zip

    - name: Run Python Script
      run: |
        # Zip ke andar wali main python file ko run karega
        python playz_extractor.py

    - name: Commit and push live-events.json
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add live-events.json || true
        git commit -m "Auto-generated live-events.json [skip ci]" || echo "No changes to commit"
        git push || echo "No changes to push"
        
