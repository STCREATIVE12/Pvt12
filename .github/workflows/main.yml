name: Generate Live Events JSON

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '*/30 * * * *'  # Ab yeh har 30 minutes mein run hoga

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pycryptodome

    - name: Extract Protected ZIP
      env:
        ZIP_PASS: ${{ secrets.ZIP_PASSWORD }}
      run: unzip -P "$ZIP_PASS" playz_extractor.zip

    - name: Run Python Script
      run: python playz_extractor.py

    - name: Commit and Push live-events.json
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git stash
        git pull --rebase origin main || git pull --rebase origin master
        git stash pop || false
        git add live-events.json
        git diff --staged --quiet || git commit -m "Auto-update live-events.json via Actions [skip ci]"
        git push
        
