name: Generate Live Events JSON

on:
  schedule:
    # Har 3 ghante mein automatic run hoga (aap apne hisab se time change kar sakte hain)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Isse aap GitHub par manual button daba kar bhi run kar sakte hain

jobs:
  run-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome

      - name: Run Extractor Script
        run: |
          python playz_extractor.py

      - name: Commit and Push live-events.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live-events.json
          git diff --staged --quiet || git commit -m "Auto-update live-events.json via Actions [skip ci]"
          git push
