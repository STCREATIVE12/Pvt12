name: Run playztv test

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  extract-livxow:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pycryptodome

    - name: Run Extraction Script
      run: python playz_extractor.py

    - name: Commit and Push Live Events JSON
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 Auto-update livxow_live_events.json via GitHub Actions"
        branch: main
        file_pattern: "ive-events.json"
